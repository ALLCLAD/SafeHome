spring.application.name=safehome_api
# 1. Indiquer à Spring Boot de charger le fichier .env situé à la racine du backend
spring.config.import=optional:file:.env[.properties]

# 2. Configurer la connexion à Neon DB en récupérant les variables du .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. Paramètres JPA / Hibernate (pour créer/mettre à jour automatiquement vos tables en dev)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 4. Variables personnalisées (que vous pourrez injecter dans vos services Java via @Value)
app.jwt.secret=${JWT_SECRET}
mqtt.broker.url=${MQTT_BROKER_URL}
mqtt.client.id=${MQTT_CLIENT_ID}