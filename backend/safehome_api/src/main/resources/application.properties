spring.application.name=safehome_api

# 1. Charger les variables d'environnement locales si le fichier .env existe
spring.config.import=optional:file:.env[.properties]

# 2. Port du serveur (Render fournit la variable $PORT automatiquement, sinon 8080 en local)
server.port=${PORT:${SERVER_PORT:8080}}

# 3. Connexion PostgreSQL (Neon DB)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 4. JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 5. Paramètres applicatifs (injectables via @Value)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}

# 6. Broker MQTT
mqtt.broker.url=${MQTT_BROKER_URL}
mqtt.client.id=${MQTT_CLIENT_ID:safehome_backend}
mqtt.topic.prefix=${MQTT_TOPIC_PREFIX:safehome}
